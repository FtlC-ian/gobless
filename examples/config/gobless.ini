; ============================================================
; EXAMPLE ONLY — NOT FOR PRODUCTION
; Replace ALL values below with your real configuration.
; This file is safe to commit to public repos as-is because
; every value is intentionally fake and non-functional.
; ============================================================

[CA]

; -----------------------------------------------------------------
; KMS key ID for asymmetric signing mode.
; Typically a full KMS key ARN. Required when signer_type = kms.
; -----------------------------------------------------------------
KMS_KEY_ID = arn:aws:kms:us-east-1:123456789012:key/example-key-id-replace-me

; -----------------------------------------------------------------
; Signer type: "rsa" (PEM file) or "kms" (AWS KMS asymmetric key).
; -----------------------------------------------------------------
SIGNER_TYPE = kms

; -----------------------------------------------------------------
; Default certificate TTL in seconds. Must be <= MAX_TTL.
; -----------------------------------------------------------------
DEFAULT_TTL = 3600

; -----------------------------------------------------------------
; Hard cap on certificate TTL in seconds. Requests above this are rejected.
; -----------------------------------------------------------------
MAX_TTL = 3600

; -----------------------------------------------------------------
; Minimum RSA key size in bits. Must be >= 2048.
; -----------------------------------------------------------------
RSA_MIN_KEY_BITS = 2048

[PRINCIPAL]

; -----------------------------------------------------------------
; Allowed principal names (comma-separated or repeated key).
; Requests for names NOT in this list are rejected.
; -----------------------------------------------------------------
ALLOWED = alice,bob,carol,deploy-bot

; -----------------------------------------------------------------
; Restrict which certificate types may be issued: "user" or "host".
; Leave unset to allow both user and host certificates.
; -----------------------------------------------------------------
ALLOWED_CERT_TYPES = user

; -----------------------------------------------------------------
; Enforce that the requesting IAM username matches the principal name.
; Set to true in production to bind certificates to caller identity.
; -----------------------------------------------------------------
ENFORCE_IAM_BINDING = false

; -----------------------------------------------------------------
; Expected AWS account ID. If set, requests from other accounts are rejected.
; -----------------------------------------------------------------
EXPECTED_ACCOUNT_ID = 123456789012

[LAMBDA]

; -----------------------------------------------------------------
; AWS region where GoBless is deployed.
; -----------------------------------------------------------------
REGION = us-east-1

; -----------------------------------------------------------------
; Lambda function name (used for self-reference in audit events).
; -----------------------------------------------------------------
FUNCTION_NAME = gobless

[LOGGING]

; -----------------------------------------------------------------
; Log level: debug, info, warn, or error.
; -----------------------------------------------------------------
LEVEL = info

; -----------------------------------------------------------------
; Enable structured audit logging to DynamoDB.
; -----------------------------------------------------------------
AUDIT_ENABLED = true

; -----------------------------------------------------------------
; Audit fail-open: if true, signing proceeds when audit writes fail.
; SECURITY: Set to false in production.
; -----------------------------------------------------------------
AUDIT_FAIL_OPEN = false
